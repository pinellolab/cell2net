name: Build & Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_doc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11"

      - name: Install dependency
        shell: bash
        run: |
          sudo apt-get install -y pandoc jq
          pip install sphinx pydata-sphinx-theme pandoc \
            nbsphinx sphinx-autodoc-typehints myst-parser myst_nb \
            sphinx_copybutton sphinxcontrib.bibtex sphinx_tabs sphinxext-opengraph

      - name: Install cell2net
        shell: bash
        run: |
          pip install ${GITHUB_WORKSPACE}

      - name: Get Cell2net version
        id: get_version
        shell: bash
        run: |
          VERSION_NUMBER=$(python -c "import cell2net; print(cell2net.__version__)")
          echo "Cell2net version: $VERSION_NUMBER"
          echo "VERSION=$VERSION_NUMBER" >> $GITHUB_ENV

      - name: Build doc
        shell: bash
        run: sphinx-build -b html ${GITHUB_WORKSPACE}/docs _build/html

      - name: Deploy doc
        # only deploy when pushing to main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.7.4
        with:
          branch: gh-pages
          folder: _build/html
          # deploy to versioned folder
          target-folder: docs/${{ env.VERSION }}
          clean: true
          single-commit: true
